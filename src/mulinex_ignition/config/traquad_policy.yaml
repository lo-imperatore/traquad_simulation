# Controllers for the traquad IsaacLab policies (gz_traquad_policy.launch.py).
# Same as mulinex_mf.yaml with the leg drive of training (IsaacLab ImplicitActuator legs:
# stiffness 60, damping 0.6) and the default pose of the policy (HFE +-1.47).
controller_manager:
  ros__parameters:
    imu_topic: "/omnicar/imu"

    update_rate: 250 # Hz

    joint_state_broadcaster_1:
      type: joint_state_broadcaster/JointStateBroadcaster
      
    # omni_control:
    #   type: omni_vel_controller/OmniVelController 

    wheels_vel_controller:
      type: wheels_vel_cnt/WheelsVelCnt

    pd_controller:
      type: rbt_pd_cnt/Rbt_PD_cnt


joint_state_broadcaster_1:
  ros__parameters:
    joints:
      - LF_HFE
      - LH_HFE
      - RF_HFE
      - RH_HFE
      - joint_wheel_1_LEFT_F
      - joint_wheel_2_LEFT_F
      - joint_wheel_3_LEFT_F
      - joint_wheel_4_LEFT_F
      - joint_wheel_1_LEFT_H
      - joint_wheel_2_LEFT_H
      - joint_wheel_3_LEFT_H
      - joint_wheel_4_LEFT_H
      - joint_wheel_1_RIGHT_F
      - joint_wheel_2_RIGHT_F
      - joint_wheel_3_RIGHT_F
      - joint_wheel_4_RIGHT_F
      - joint_wheel_1_RIGHT_H
      - joint_wheel_2_RIGHT_H
      - joint_wheel_3_RIGHT_H
      - joint_wheel_4_RIGHT_H
      - body_left_F_ankle
      - body_left_H_ankle
      - body_right_F_ankle
      - body_right_H_ankle
    use_sim_time: True


wheels_vel_controller:
  ros__parameters:
    joints:
      - joint_wheel_1_LEFT_F
      - joint_wheel_2_LEFT_F
      - joint_wheel_3_LEFT_F
      - joint_wheel_4_LEFT_F
      - joint_wheel_1_LEFT_H
      - joint_wheel_2_LEFT_H
      - joint_wheel_3_LEFT_H
      - joint_wheel_4_LEFT_H
      - joint_wheel_1_RIGHT_F
      - joint_wheel_2_RIGHT_F
      - joint_wheel_3_RIGHT_F
      - joint_wheel_4_RIGHT_F
      - joint_wheel_1_RIGHT_H
      - joint_wheel_2_RIGHT_H
      - joint_wheel_3_RIGHT_H
      - joint_wheel_4_RIGHT_H
    use_sim_time: True

# omni_control:
#   ros__parameters:
#     mecanum_angle: 135.0
#     wheel_rad: 0.03875
#     pub_odom: true
#     sim: true

pd_controller:
  ros__parameters:
    joint:
      - LF_HFE        # Left HIP Front
      - LH_HFE        # Left HIP Back
      - RF_HFE        # Right HIP Front
      - RH_HFE        # Right HIP Back
      # - LF_WHEEL_JNT    
      # - LH_WHEEL_JNT
      # - RF_WHEEL_JNT
      # - RH_WHEEL_JNT
      
 
    K_d:
      - 0.6
      - 0.6
      - 0.6
      - 0.6



      
    K_p:
      - 60.0
      - 60.0
      - 60.0
      - 60.0


     
 
 # Nota: Hip: 120° = 2.094 rad, Knee: 60° = 1.047 rad
    init_pos:   # default pose of the policy (env.yaml scene.robot.init_state.joint_pos)
      - 1.47
      - -1.47
      - -1.47
      - 1.47
    use_sim_time: True