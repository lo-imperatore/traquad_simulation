controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz, the physics rate: the leg PD is explicit, IsaacLab solves it implicitly every physics step

    joint_state_broadcaster_1:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheels_vel_controller:
      type: wheels_vel_cnt/WheelsVelCnt

    pd_controller:
      type: rbt_pd_cnt/Rbt_PD_cnt


joint_state_broadcaster_1:
  ros__parameters:
    joints:
      - LF_HFE
      - LH_HFE
      - RF_HFE
      - RH_HFE
      - LF_KFE
      - LH_KFE
      - RF_KFE
      - RH_KFE
      - LF_WHEEL_JNT
      - LH_WHEEL_JNT
      - RF_WHEEL_JNT
      - RH_WHEEL_JNT
    use_sim_time: True


# Joint order must be grouped as [LF, LH, RF, RH]: the controller maps the
# WheelVelocityCommand fields (v_lf, v_lb, v_rf, v_rb) onto these groups.
wheels_vel_controller:
  ros__parameters:
    joints:
      - LF_WHEEL_JNT
      - LH_WHEEL_JNT
      - RF_WHEEL_JNT
      - RH_WHEEL_JNT
    use_sim_time: True


# Gains and init_pos match the IsaacLab training config
# (rlg_quad_controller/models/omni_flat_v1/env.yaml: actuators.legs, init_state.joint_pos)
pd_controller:
  ros__parameters:
    joint:
      - LF_HFE
      - LH_HFE
      - RF_HFE
      - RH_HFE
      - LF_KFE
      - LH_KFE
      - RF_KFE
      - RH_KFE

    K_p: [100.7, 100.7, 100.7, 100.7, 100.7, 100.7, 100.7, 100.7]
    # Kd calibrated against IsaacLab (2026-11-06, policy 2026-10-18_12-06-11, flat, stand and vx 0.3): training uses
    # Kp 100 / Kd 1 implicit with velocity_limit_sim 10, which an explicit 1 kHz PD does not reproduce (Kd 1: 2-3x
    # more shaking). With the 10 rad/s velocity limit (gz_omniquad_sim.launch.py) Kd 4 matches the joint speed and
    # the action changes of IsaacLab; Kd 5 is calmer than IsaacLab, Kd 6 suppresses the policy jitter entirely.
    K_d: [4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0]

    init_pos: [2.0, -2.0, -2.0, 2.0, -1.2, 1.2, 1.2, -1.2]
    use_sim_time: True
